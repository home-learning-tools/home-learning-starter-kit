<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="material-type" content="reference">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>読書メモ</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #29332f; background: #eef2ea;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
    main { width: min(760px, calc(100% - 32px)); margin: 32px auto;
      padding: 40px; background: #fffdf7; border: 1px solid #ccd3c7; }
    h1 { margin: 0; font-size: 1.8rem; }
    .meta { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin: 20px 0; }
    .line { min-height: 42px; padding: 8px; border-bottom: 1px solid #9fa99f; }
    .prompt { margin-top: 24px; font-weight: 700; color: #1f6a55; }
    .writing { height: 112px; background: repeating-linear-gradient(
      to bottom, transparent 0, transparent 34px, #c9cdc7 35px); }
    footer { margin-top: 28px; color: #66716c; font-size: .8rem; }
    @media print { body { background: white; } main { margin: 0; border: 0; width: 100%; } }
    /* stylelint-disable-next-line media-feature-range-notation */
    @media (max-width: 560px) { main { padding: 24px; } .meta { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>読書メモ</h1>
    <section class="meta"><div class="line">本の題名：</div><div class="line">日付：</div></section>
    <p class="prompt">心に残った場面は？</p><div class="writing"></div>
    <p class="prompt">登場人物は、どう変わった？</p><div class="writing"></div>
    <p class="prompt">そう思った文や言葉は？</p><div class="writing"></div>
    <footer>家庭学習スターター・デモ用のオリジナル教材です。</footer>
  </main>
</body>
</html>
